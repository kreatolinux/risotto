<!DOCTYPE html>
<html lang="{{- site.Language.Lang -}}">

    <head>
        {{- partial "head.html" . -}}
    </head>

    <body>
        <div class="page{{ if .IsHome }} page--home{{ end }}">

            {{- if .IsHome }}{{ partial "home-background.html" . }}{{ end -}}

            {{- partial "header.html" . -}}

            <main class="page__main" id="content">
                {{- block "main" . }}{{- end }}
            </main>

            {{- partial "footer.html" . -}}

        </div>
        {{- partial "mermaid.html" . -}}
        {{- partial "kongue.html" . -}}
    </body>

</html>
