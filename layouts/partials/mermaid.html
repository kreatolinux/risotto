{{ if or .Params.mermaid (findRE "class=\"mermaid\"" .Content) }}
<script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
  
  const getStyle = (prop) => getComputedStyle(document.documentElement).getPropertyValue(prop).trim();
  
  const palette = {
    primaryColor: getStyle('--base0D'),
    primaryTextColor: getStyle('--base05'),
    primaryBorderColor: getStyle('--base03'),
    lineColor: getStyle('--base04'),
    secondaryColor: getStyle('--base0B'),
    tertiaryColor: getStyle('--base01')
  };

  const isDark = getStyle('--base00').toLowerCase() < '#888888';

  mermaid.initialize({ 
    startOnLoad: false,
    theme: isDark ? 'dark' : 'default',
    themeVariables: palette
  });

  async function initMermaid() {
    await mermaid.run({
      querySelector: '.mermaid',
      postRenderCallback: (id) => {
        const svgElement = document.getElementById(id);
        const container = svgElement.parentElement;
        
        svgElement.style.maxWidth = '100%';
        svgElement.style.height = '100%';
        
        const panZoom = svgPanZoom(svgElement, {
          zoomEnabled: true,
          controlIconsEnabled: false,
          fit: true,
          center: true,
          minZoom: 0.1,
          maxZoom: 10
        });

        // Custom controls
        const controls = document.createElement('div');
        controls.className = 'mermaid-controls';
        controls.innerHTML = `
          <button class="zoom-in" title="Zoom In"><i class="fa-solid fa-plus"></i></button>
          <button class="zoom-out" title="Zoom Out"><i class="fa-solid fa-minus"></i></button>
          <button class="zoom-reset" title="Reset"><i class="fa-solid fa-arrows-to-dot"></i></button>
        `;
        
        container.appendChild(controls);

        controls.querySelector('.zoom-in').addEventListener('click', () => panZoom.zoomIn());
        controls.querySelector('.zoom-out').addEventListener('click', () => panZoom.zoomOut());
        controls.querySelector('.zoom-reset').addEventListener('click', () => {
          panZoom.resetZoom();
          panZoom.center();
        });
      }
    });
  }

  initMermaid();
</script>

<style>
  .mermaid {
    position: relative;
    height: 400px;
    overflow: hidden;
    border: 1px solid var(--inner-bg);
    margin-bottom: 1rem;
    background-color: var(--bg);
  }
  .mermaid svg {
    height: 100% !important;
    width: 100% !important;
  }
  .mermaid-controls {
    position: absolute;
    top: 10px;
    right: 10px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    z-index: 10;
  }
  .mermaid-controls button {
    width: 30px;
    height: 30px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: var(--inner-bg);
    color: var(--fg);
    border: 1px solid var(--muted);
    cursor: pointer;
    font-size: 14px;
    transition: background-color 0.2s;
  }
  .mermaid-controls button:hover {
    background-color: var(--off-bg);
    color: var(--highlight);
  }
</style>
{{ end }}
